name: Vendor PowerShell Modules

# Re-saves the PowerShell modules pinned in requirements.psd1 into ./modules and opens a PR with the result.
# The release workflow refuses to publish while ./modules and requirements.psd1 are out of sync,
# so merge the PR opened by this workflow before releasing.

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.psd1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Save pinned modules to ./modules
        shell: pwsh
        run: ./scripts/Sync-VendoredModules.ps1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: chore/vendor-pwsh-modules
          delete-branch: true
          add-paths: |
            modules
            requirements.lock.psd1
          commit-message: 'chore(deps): vendor PowerShell modules from requirements.psd1'
          title: 'chore(deps): vendor PowerShell modules from requirements.psd1'
          labels: dependencies
          body: |
            Refreshes `./modules` and `requirements.lock.psd1` to match the versions pinned in `requirements.psd1` (generated by `scripts/Sync-VendoredModules.ps1`).

            Each package's SHA512 was verified before extraction: versions already in `requirements.lock.psd1` must match the recorded hash, and new versions must match the hash the PowerShell Gallery publishes for that package.

            - [ ] Review the module changes (changelogs / diff) and any new `sha512` / `contentSha512` entries in `requirements.lock.psd1`
            - [ ] Merge before running the Release workflow (it verifies `./modules` matches `requirements.psd1`)

            > [!NOTE]
            > This PR was opened with the workflow `GITHUB_TOKEN`, so CI workflows do not run on it automatically.
            > Close and reopen the PR (or push a commit) to trigger CI.
