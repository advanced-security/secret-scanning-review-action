name: Check PowerShell Module Versions

on:
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for newer PSGallery module versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read pinned versions from requirements.psd1 (exact pins like '[1.2.3]')
          $requirements = Import-PowerShellDataFile -Path requirements.psd1

          $outdated = @()

          foreach ($name in ($requirements.Keys | Sort-Object)) {
            $pinnedVersion = ([string]$requirements[$name].version).Trim('[', ']')
            $repository = if ($requirements[$name].repository) { $requirements[$name].repository } else { 'PSGallery' }

            $latest = (Find-Module -Name $name -Repository $repository).Version.ToString()

            Write-Output "${name}: pinned=$pinnedVersion latest=$latest"

            if ($pinnedVersion -ne $latest) {
              $outdated += @{
                Name           = $name
                PinnedVersion  = $pinnedVersion
                LatestVersion  = $latest
              }
            }
          }

          if ($outdated.Count -eq 0) {
            Write-Output "All pinned PowerShell modules are up to date."
            exit 0
          }

          # Build issue body
          $title = "chore(deps): update pinned PowerShell module versions"

          $body = "The weekly version check found newer PowerShell Gallery modules than what is pinned in ``requirements.psd1``.`n`n"
          $body += "| Module | Pinned | Latest |`n"
          $body += "|--------|--------|--------|`n"
          foreach ($m in $outdated) {
            $body += "| $($m.Name) | ``$($m.PinnedVersion)`` | ``$($m.LatestVersion)`` |`n"
          }
          $body += "`n**Action required:** Review the changelogs and update the version pins in ``requirements.psd1``. "
          $body += "Once that change merges to ``main``, the **Vendor PowerShell Modules** workflow opens a PR that refreshes ``./modules``."

          # Check if an open issue with this title already exists
          $existing = gh issue list --state open --search "in:title $title" --json number --jq '.[0].number' 2>$null
          if ($existing) {
            Write-Output "Open issue #$existing already exists — skipping."
            exit 0
          }

          gh issue create --title $title --body $body --label "dependencies"
