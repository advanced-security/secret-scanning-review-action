name: 'Secret Scanning Review Action'
author: "@felickz"
description: 'Increase the visibility of Secret Scanning alerts as part of pull request collaboration'
inputs:
  token:
    description: 'GitHub access token with access to the secret scanning alerts of the repository (see the token requirements in the README). The github.token cannot be used as it does not provide secret scanning alert access.'
    required: true
  fail-on-alert:
    description: 'A boolean to raise workflow/annotation errors (instead of warnings) and fail the workflow if an alert is detected.'
    required: false
    default: 'false'
  fail-on-alert-exclude-closed:
    description: "A boolean to exclude an alert from fail-on-alert if it is marked as closed (state: 'resolved')."
    required: false
    default: 'false'
  fail-closed:
    description: 'A boolean that controls how GitHub API errors are handled. When true (default), any API error that prevents a complete review fails the workflow, as does a merge queue that does not require each pull request to pass its own required checks (merge_group events). When false, API errors are reported as warnings and the review continues with partial results (or is skipped) without failing the workflow. Detected alerts still honor fail-on-alert either way.'
    required: false
    default: 'true'
  skip-closed-alerts:
    description: 'A boolean to enable or disable skipping closed alerts from evaluation.'
    required: false
    default: 'false'
  disable-pr-comment:
    description: 'A boolean to disable the PR comment feature.'
    required: false
    default: 'false'
  disable-workflow-summary:
    description: 'A boolean to disable the workflow summary.'
    required: false
    default: 'false'
  runtime:
    description: 'The runtime to use for the action (`powershell` or `python`).'
    required: false
    default: 'powershell'
  python-http-proxy-url:
    description: 'The URL of the http proxy to use for GitHub API requests (python runtime only).'
    required: false
    default: ''
  python-https-proxy-url:
    description: 'The URL of the https proxy to use for GitHub API requests (python runtime only).'
    required: false
    default: ''
  python-verify-ssl:
    description: 'A boolean to enable or disable SSL verification for GitHub API requests (python runtime only). NOTE: This is NOT recommended and may introduce additional security risks.'
    required: false
    default: 'true'
outputs:
  alerts:
    description: 'JSON array with details about the alerts detected in the PR.'
    value: ${{ steps.python-run.outputs.alerts || steps.powershell-run.outputs.alerts }}
runs:
    using: composite
    steps:
      - name: Run Powershell Script
        if: ${{ inputs.runtime == 'powershell' }}
        id: powershell-run
        run: |
          & "$env:ACTION_PATH/action.ps1" `
            -GitHubToken $env:GITHUB_TOKEN `
            -FailOnAlert ($env:INPUT_FAIL_ON_ALERT -eq 'true') `
            -FailOnAlertExcludeClosed ($env:INPUT_FAIL_ON_ALERT_EXCLUDE_CLOSED -eq 'true') `
            -DisablePRComment ($env:INPUT_DISABLE_PR_COMMENT -eq 'true') `
            -DisableWorkflowSummary ($env:INPUT_DISABLE_WORKFLOW_SUMMARY -eq 'true') `
            -SkipClosedAlerts ($env:INPUT_SKIP_CLOSED_ALERTS -eq 'true') `
            -FailClosed ($env:INPUT_FAIL_CLOSED -ne 'false')
        shell: pwsh
        env:
          ACTION_PATH: ${{ github.action_path }}
          GITHUB_TOKEN: ${{ inputs.token }}
          INPUT_FAIL_ON_ALERT: ${{ inputs.fail-on-alert }}
          INPUT_FAIL_ON_ALERT_EXCLUDE_CLOSED: ${{ inputs.fail-on-alert-exclude-closed }}
          INPUT_DISABLE_PR_COMMENT: ${{ inputs.disable-pr-comment }}
          INPUT_DISABLE_WORKFLOW_SUMMARY: ${{ inputs.disable-workflow-summary }}
          INPUT_SKIP_CLOSED_ALERTS: ${{ inputs.skip-closed-alerts }}
          INPUT_FAIL_CLOSED: ${{ inputs.fail-closed }}
      - name: Run Python Script
        if: ${{ inputs.runtime == 'python' }}
        id: python-run
        run: |
          python -m pip install -r "$ACTION_PATH/requirements.txt" --require-hashes
          python "$ACTION_PATH/action.py" \
            --FailOnAlert "$INPUT_FAIL_ON_ALERT" \
            --FailOnAlertExcludeClosed "$INPUT_FAIL_ON_ALERT_EXCLUDE_CLOSED" \
            --DisablePRComment "$INPUT_DISABLE_PR_COMMENT" \
            --ProxyURLHTTP "$INPUT_PROXY_HTTP" \
            --ProxyURLHTTPS "$INPUT_PROXY_HTTPS" \
            --VerifySSL "$INPUT_VERIFY_SSL" \
            --SkipClosedAlerts "$INPUT_SKIP_CLOSED_ALERTS" \
            --DisableWorkflowSummary "$INPUT_DISABLE_WORKFLOW_SUMMARY" \
            --FailClosed "${INPUT_FAIL_CLOSED:-true}"
        shell: bash
        env:
          ACTION_PATH: ${{ github.action_path }}
          GITHUB_TOKEN: ${{ inputs.token }}
          INPUT_FAIL_ON_ALERT: ${{ inputs.fail-on-alert }}
          INPUT_FAIL_ON_ALERT_EXCLUDE_CLOSED: ${{ inputs.fail-on-alert-exclude-closed }}
          INPUT_DISABLE_PR_COMMENT: ${{ inputs.disable-pr-comment }}
          INPUT_PROXY_HTTP: ${{ inputs.python-http-proxy-url }}
          INPUT_PROXY_HTTPS: ${{ inputs.python-https-proxy-url }}
          INPUT_VERIFY_SSL: ${{ inputs.python-verify-ssl }}
          INPUT_SKIP_CLOSED_ALERTS: ${{ inputs.skip-closed-alerts }}
          INPUT_DISABLE_WORKFLOW_SUMMARY: ${{ inputs.disable-workflow-summary }}
          INPUT_FAIL_CLOSED: ${{ inputs.fail-closed }}
          # Use UTF-8 for file I/O and stdout on every OS (Python on Windows otherwise defaults to cp1252, which cannot encode the summary emoji)
          PYTHONUTF8: '1'
branding:
  icon: "lock"
  color: "gray-dark"
